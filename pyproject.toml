[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-expression-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented schedule-string claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
cron-expression-validation-claim-audit = "cron_expression_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["cron_expression_validation_claim_audit*"]
